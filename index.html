<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculateur de l'âge de grossesse</title>

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      position: relative;
      background: linear-gradient(135deg, #ffb347, #9be15d);
      padding: 30px 25px;
      border-radius: 20px;
      box-shadow: 0px 8px 20px rgba(0,0,0,0.2);
      max-width: 420px;
      width: 90%;
      text-align: center;
    }

    h2 { color: #004aad; }

    label {
      color: #800080;
      font-weight: bold;
      display: block;
      margin-top: 15px;
    }

    input {
      padding: 10px;
      width: 100%;
      border-radius: 10px;
      border: 1px solid #ccc;
      margin-top: 5px;
    }

    button {
      margin-top: 15px;
      padding: 12px;
      width: 100%;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    .result {
      margin-top: 15px;
      padding: 10px;
      border-radius: 10px;
      font-weight: bold;
    }

    #resultatAge { background: #fff8f0; }
    #resultatSA { background: #f5f0ff; }
    #resultatDDR { background: #e6f7ff; }
  </style>
</head>

<body>
<div class="card">

  <img src="https://raw.githubusercontent.com/docteur-jaa/index.html/main/images/symbolgynecooeuf.png" style="max-width:120px;">

  <h2>Calcul grossesse</h2>

  <label>DDR :</label>
  <input type="date" id="ddr">

  <label>Calculer date à SA :</label>
  <input type="number" id="sa" min="1" max="45">

  <label>DDR à partir SA + jours :</label>
  <div style="display:flex; gap:5px;">
    <input type="number" id="saActuel" placeholder="SA" min="0" max="45">
    <input type="number" id="joursActuel" placeholder="J" min="0" max="6">
  </div>

  <button onclick="calculer()">Calculer</button>

  <!-- Résultats -->
  <div id="resultatAge" class="result">
    Âge grossesse : <span id="valAge"></span>
  </div>

  <div id="resultatSA" class="result">
    Date pour <span id="valSA"></span>
  </div>

  <div id="resultatDDR" class="result">
    DDR calculée : <span id="valDDR"></span>
  </div>

</div>

<script>
function calculer() {

  const today = new Date();

  // Reset valeurs
  document.getElementById('valAge').innerText = "";
  document.getElementById('valSA').innerText = "";
  document.getElementById('valDDR').innerText = "";

  const ddr = document.getElementById('ddr').value;

  // ====================
  // 1) Age grossesse
  // ====================
  if (ddr) {
    const ddrDate = new Date(ddr);
    const diff = today - ddrDate;

    const jours = Math.floor(diff / (1000*60*60*24));
    const semaines = Math.floor(jours / 7);
    const jr = jours % 7;

    document.getElementById('valAge').innerText =
      semaines + " SA + " + jr + " J";

    // ====================
    // 2) Date pour SA
    // ====================
    const sa = parseInt(document.getElementById('sa').value);

    if (!isNaN(sa) && sa > 0 && sa <= 45) {

      const dateSA = new Date(ddrDate.getTime() + sa*7*24*60*60*1000);

      document.getElementById('valSA').innerText =
        sa + " SA : " +
        dateSA.toLocaleDateString('fr-FR', {
          day:'2-digit',
          month:'2-digit',
          year:'numeric'
        });
    }

  } else {
    document.getElementById('valAge').innerText = "Entrer DDR";
  }

  // ====================
  // 3) DDR calculée
  // ====================
  const saActuel = parseInt(document.getElementById('saActuel').value);
  const joursActuel = parseInt(document.getElementById('joursActuel').value);

  if (!isNaN(saActuel) && saActuel >= 0) {

    if (!isNaN(joursActuel) && joursActuel > 6) {
      document.getElementById('valDDR').innerText = "max 6 jours";
      return;
    }

    const totalJours = saActuel*7 + (isNaN(joursActuel) ? 0 : joursActuel);

    const ddrCalc = new Date(today.getTime() - totalJours*24*60*60*1000);

    document.getElementById('valDDR').innerText =
      ddrCalc.toLocaleDateString('fr-FR', {
        day:'2-digit',
        month:'2-digit',
        year:'numeric'
      });
  }
}
</script>

</body>
</html>

</body>
</html>
</html>
