<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculateur d'âge de grossesse</title>
  <meta name="description" content="Calculez l'âge de la grossesse à partir de la date des dernières règles - Dr Jaafar, Regueb.">

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      position: relative;
      background: linear-gradient(135deg, #ffb347, #9be15d);
      padding: 30px 25px;
      border-radius: 20px;
      box-shadow: 0px 8px 20px rgba(0,0,0,0.2);
      max-width: 420px;
      width: 90%;
      text-align: center;
      transition: transform 0.3s ease;
    }

    .card:hover { transform: scale(1.03); }

    h2 { color: #004aad; margin-bottom: 5px; font-size: 24px; }

    .subtitle { color: #222; font-size: 14px; margin-bottom: 20px; font-style: italic; }

    label { color: #800080; font-weight: bold; display: block; margin-top: 15px; margin-bottom: 5px; }

    input[type="date"], input[type="number"] {
      padding: 12px;
      width: 100%;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 14px;
      box-sizing: border-box;
    }

    button {
      margin-top: 15px;
      padding: 12px;
      width: 100%;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.2s ease;
    }

    button:hover { background: #0056b3; transform: translateY(-2px); }

    .result {
      margin-top: 15px;
      font-size: 16px;
      font-weight: bold;
      padding: 12px;
      border-radius: 12px;
      box-shadow: inset 0px 2px 5px rgba(0,0,0,0.1);
    }

    #resultatAge {
      background-color: #fff8f0;
      color: #8B4513; /* brun */
    }

    #resultatSA {
      background-color: #f5f0ff;
      color: #800080; /* violet */
    }

    /* Coordonnées cachées */
    #contact {
      display: none;
      position: absolute;
      top: 45px;   /* juste sous le bouton, au-dessus du logo */
      right: 15px;
      text-align: right;
      font-size: 13px;
      background: #fff;
      padding: 8px;
      border-radius: 8px;
      box-shadow: 0px 2px 6px rgba(0,0,0,0.2);
    }
    #contact .adresse {
      color: #A0522D; /* marron clair */
      font-weight: bold;
    }
    #contact .tel {
      color: #800080; /* violet */
      font-weight: bold;
    }

    /* Bouton coordonnées */
    .btn-contact {
      position: absolute;
      max-width: 140px;
      top: 0px;
      right: 5px;
      font-size: 14px;
      padding: 5px 10px;
      background: #f9f9f9;   /* fond clair */
      color: #333;           /* texte foncé */
      border: 1px solid #ccc;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-contact:hover {
      background: #e0e0e0;
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- Bouton pour afficher/masquer les coordonnées -->
    <button class="btn-contact" onclick="toggleContact()">Voir mes coordonnées</button>

    <!-- Coordonnées cachées -->
    <div id="contact">
      <div class="adresse">Dr Ben Ali Jaafar</div>
      <div class="tel">98670415</div>
    </div>

    <!-- Logo -->
    <img src="https://raw.githubusercontent.com/docteur-jaa/index.html/main/images/symbolgynecooeuf.png" alt="Logo Dr Jaafar" style="max-width:120px;margin-top:10px;margin-bottom:8px;">   
    <h2>Calcul d'âge de grossesse</h2>
    <div class="subtitle">Dr Jaafar Gynécologue – Regueb</div>

    <label for="ddr">Date des dernières règles :</label>
    <input type="date" id="ddr">

    <label for="sa">Nombre de semaines souhaitées :</label>
    <input type="number" id="sa" placeholder="Ex: 20">

    <button onclick="calculer()">Calculer</button>

    <!-- Deux cases séparées -->
    <div id="resultatAge" class="result" aria-live="polite"></div>
    <div id="resultatSA" class="result" aria-live="polite"></div>
  </div>

  <script>
    function calculer() {
      const ddr = document.getElementById('ddr').value;
      if (!ddr) {
        document.getElementById('resultatAge').innerText = "Veuillez entrer une date.";
        document.getElementById('resultatSA').innerText = "";
        return;
      }
      const ddrDate = new Date(ddr);
      const today = new Date();

      // Calcul de l'âge actuel
      const diff = today - ddrDate;
      const jours = Math.floor(diff / (1000 * 60 * 60 * 24));
      const semaines = Math.floor(jours / 7);
      const joursRestants = jours % 7;

      document.getElementById('resultatAge').innerText =
        "Âge de la grossesse : " + semaines + " semaines + " + joursRestants + " jours.";

      // Récupérer le nombre de SA souhaité
      const sa = parseInt(document.getElementById('sa').value);
      if (!isNaN(sa) && sa > 0) {
        const dateSA = new Date(ddrDate.getTime() + sa*7*24*60*60*1000);
        document.getElementById('resultatSA').innerText =
          "Date estimée pour " + sa + " SA : " + dateSA.toLocaleDateString();
      } else {
        document.getElementById('resultatSA').innerText = "";
      }
    }

    function toggleContact() {
      const contactDiv = document.getElementById('contact');
      if (contactDiv.style.display === "none" || contactDiv.style.display === "") {
        contactDiv.style.display = "block";
      } else {
        contactDiv.style.display = "none";
      }
    }
  </script>
</body>
</html>
