<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculateur de l'âge de grossesse</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      position: relative;
      background: linear-gradient(135deg, #ffb347, #9be15d);
      padding: 30px 25px;
      border-radius: 20px;
      box-shadow: 0px 8px 20px rgba(0,0,0,0.2);
      max-width: 420px;
      width: 90%;
      text-align: center;
      min-height: 580px; 
    }

    h2 { color: #004aad; margin-bottom: 5px; font-size: 24px; }
    .subtitle { color: #222; font-size: 14px; margin-bottom: 20px; font-style: italic; }
    label { color: #800080; font-weight: bold; display: block; margin-top: 15px; margin-bottom: 5px; text-align: left;}

    input[type="date"], input[type="number"] {
      padding: 12px;
      width: 100%;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
    }

    input:focus { border: 2px solid #004aad; }

    .results-container {
      margin-top: 20px;
      height: 220px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .result {
      font-size: 16px;
      font-weight: bold;
      padding: 12px;
      border-radius: 12px;
      display: flex; 
      justify-content: space-between; 
      align-items: center;
      min-height: 20px;
      opacity: 0; 
      transition: opacity 0.8s ease-in-out;
      pointer-events: none;
    }

    #resultatAge { background-color: #fff8f0; color: #8B4513; opacity: 1; pointer-events: auto; }
    #resultatSA { background-color: #f5f0ff; color: #800080; }
    #resultatDDR { background-color: #e6f7ff; color: #004aad; }

    #contact {
      display: none;
      position: absolute;
      top: 45px; right: 15px;
      text-align: right;
      font-size: 13px;
      background: #fff;
      padding: 8px;
      border-radius: 8px;
      box-shadow: 0px 2px 6px rgba(0,0,0,0.2);
      z-index: 10;
    }

    .num-tel { color: #008000; text-decoration: none; }
    .btn-contact {
      position: absolute;
      top: 0px; right: 5px;
      font-size: 14px; padding: 5px 10px;
      background: #f9f9f9; color: #333;
      border: 1px solid #ccc; border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="card">
    <button class="btn-contact" onclick="toggleContact()">Voir mes coordonnées</button>

    <div id="contact">
      <div style="color:#800020; font-weight:bold; font-size: 1.2em;">Dr Ben Ali Jaafar</div>
      <div style="font-weight:bold;">
        <a href="tel:+21698670415" class="num-tel">98 670 415</a>
      </div>
    </div>

    <img src="https://raw.githubusercontent.com/docteur-jaa/index.html/main/images/symbolgynecooeuf.png" style="max-width:110px;margin-top:10px;margin-bottom:8px;">    

    <h2>Calcul de l'âge de grossesse</h2>
    <div class="subtitle">Dr Ben Ali Jaafar – Gynécologue, Regueb</div>

    <label>Date des dernières règles :</label>
    <input type="date" id="ddr" onchange="calculerAge(); calculerSA();" autofocus>

    <label>Calculer une date à X SA :</label>
    <input type="number" id="sa" placeholder="Ex: 20" oninput="calculerSA()">

    <label>Retrouver DDR (SA + jours) :</label>
    <div style="display:flex; align-items:center; gap:5px;">
      <input type="number" id="saActuel" placeholder="SA" style="width:40%;" oninput="calculerDDR()">
      <span>SA +</span>
      <input type="number" id="joursActuel" placeholder="J" style="width:40%;" oninput="calculerDDR()">
      <span>J</span>
    </div>

    <div class="results-container">
        <div id="resultatAge" class="result">
          <span>Âge de la grossesse :</span>
          <span id="valAge"></span>
        </div>

        <div id="resultatSA" class="result">
          <span id="labelSA">Date pour :</span>
          <span id="valSA"></span>
        </div>

        <div id="resultatDDR" class="result">
          <span>DDR calculée :</span>
          <span id="valDDR"></span>
        </div>
    </div>
  </div>

<script>
let timerAge, timerSA, timerDDR;
const DELAI = 15000;

function calculerAge() {
  const ddrInput = document.getElementById('ddr');
  if (ddrInput.value) {
    // Se déclenche seulement quand la date est fixée
    ddrInput.blur(); 

    const today = new Date(); today.setHours(0,0,0,0);
    const ddrDate = new Date(ddrInput.value);
    const diff = today - ddrDate;
    const jours = Math.floor(diff / (1000*60*60*24));
    
    if (jours >= 0) {
      const val = document.getElementById('valAge');
      val.innerText = Math.floor(jours/7) + " SA + " + (jours%7) + " J";
      
      clearTimeout(timerAge);
      timerAge = setTimeout(() => {
        val.innerText = ""; 
        ddrInput.value = ""; 
        ddrInput.focus();
      }, DELAI);
    }
  }
}

function calculerSA() {
  const ddrInput = document.getElementById('ddr');
  const saInput = document.getElementById('sa');
  const el = document.getElementById('resultatSA');
  const val = document.getElementById('valSA');

  if (ddrInput.value && saInput.value > 0) {
    const ddrDate = new Date(ddrInput.value);
    const dateSA = new Date(ddrDate.getTime() + saInput.value*7*24*60*60*1000);
    
    el.style.opacity = "1";
    document.getElementById('labelSA').innerText = "Date pour " + saInput.value + " SA :";
    val.innerText = dateSA.toLocaleDateString('fr-FR');
    
    clearTimeout(timerSA);
    timerSA = setTimeout(() => {
      el.style.opacity = "0";
      setTimeout(() => { 
        val.innerText = ""; 
        saInput.value = ""; 
      }, 800);
      ddrInput.focus();
    }, DELAI);
  }
}

function calculerDDR() {
  const ddrInput = document.getElementById('ddr');
  const saInput = document.getElementById('saActuel');
  const joursInput = document.getElementById('joursActuel');
  const el = document.getElementById('resultatDDR');
  const val = document.getElementById('valDDR');

  if (saInput.value !== "" && saInput.value >= 0) {
    const today = new Date(); today.setHours(0,0,0,0);
    const totalJours = parseInt(saInput.value)*7 + (parseInt(joursInput.value) || 0);
    const ddrCalc = new Date(today.getTime() - totalJours*24*60*60*1000);
    
    el.style.opacity = "1";
    val.innerText = ddrCalc.toLocaleDateString('fr-FR');
    
    clearTimeout(timerDDR);
    timerDDR = setTimeout(() => {
      el.style.opacity = "0";
      setTimeout(() => { 
        val.innerText = ""; 
        saInput.value = ""; 
        joursInput.value = "";
      }, 800);
      ddrInput.focus();
    }, DELAI);
  }
}

function toggleContact() {
  const c = document.getElementById('contact');
  c.style.display = (c.style.display === "block") ? "none" : "block";
}
</script>
</body>
</html>
