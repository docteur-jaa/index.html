<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculateur de l'âge de grossesse</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      position: relative;
      background: linear-gradient(135deg, #ffb347, #9be15d);
      padding: 30px 25px;
      border-radius: 20px;
      box-shadow: 0px 8px 20px rgba(0,0,0,0.2);
      max-width: 420px;
      width: 90%;
      text-align: center;
    }

    h2 { color: #004aad; margin-bottom: 5px; font-size: 24px; }
    .subtitle { color: #222; font-size: 14px; margin-bottom: 20px; font-style: italic; }
    label { color: #800080; font-weight: bold; display: block; margin-top: 15px; margin-bottom: 5px; text-align: left;}

    input[type="date"], input[type="number"] {
      padding: 12px;
      width: 100%;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 14px;
      box-sizing: border-box;
    }

    .result {
      margin-top: 15px;
      font-size: 16px;
      font-weight: bold;
      padding: 12px;
      border-radius: 12px;
      display: none; 
      justify-content: space-between; 
      align-items: center;
    }

    #resultatAge { background-color: #fff8f0; color: #8B4513; }
    #resultatSA { background-color: #f5f0ff; color: #800080; }
    #resultatDDR { background-color: #e6f7ff; color: #004aad; }

    #contact {
      display: none;
      position: absolute;
      top: 45px;
      right: 15px;
      text-align: right;
      font-size: 13px;
      background: #fff;
      padding: 8px;
      border-radius: 8px;
      box-shadow: 0px 2px 6px rgba(0,0,0,0.2);
      z-index: 10;
    }

    /* --- EFFET DE SURBRILLANCE ICI --- */
    .num-tel {
      color: #008000;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .num-tel:hover {
      color: #004d00; /* Devient vert foncé */
      background-color: #e6ffe6; /* Fond très légèrement vert */
      padding: 2px 5px;
      border-radius: 4px;
    }

    .btn-contact {
      position: absolute;
      top: 0px;
      right: 5px;
      font-size: 14px;
      padding: 5px 10px;
      background: #f9f9f9;
      color: #333;
      border: 1px solid #ccc;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="card">

    <button class="btn-contact" onclick="toggleContact()">Voir mes coordonnées</button>

    <div id="contact" style="font-family: Arial, sans-serif; line-height: 1.6;">
      <div style="color:#800020; font-weight:bold; font-size: 1.2em;">Dr Ben Ali Jaafar</div>
      <div style="font-weight:bold;">
        <a href="tel:+21698670415" class="num-tel">98 670 415</a>
      </div>
    </div>

    <img src="https://raw.githubusercontent.com/docteur-jaa/index.html/main/images/symbolgynecooeuf.png" style="max-width:120px;margin-top:10px;margin-bottom:8px;">    

    <h2>Calcul de l'âge de grossesse</h2>
    <div class="subtitle">Dr Ben Ali Jaafar – Gynécologue, Regueb</div>

    <label>Date des dernières règles :</label>
    <input type="date" id="ddr" oninput="calculer()">

    <label>Calculer une date à X SA :</label>
    <input type="number" id="sa" placeholder="Ex: 20" oninput="calculer()">

    <label>Retrouver DDR (SA + jours) :</label>
    <div style="display:flex; align-items:center; gap:5px;">
      <input type="number" id="saActuel" placeholder="SA" style="width:40%;" oninput="calculer()">
      <span>SA +</span>
      <input type="number" id="joursActuel" placeholder="J" style="width:40%;" oninput="calculer()">
      <span>J</span>
    </div>

    <div id="resultatAge" class="result">
      <span>Âge de la grossesse :</span>
      <span id="valAge"></span>
    </div>

    <div id="resultatSA" class="result">
      <span id="labelSA">Date pour :</span>
      <span id="valSA"></span>
    </div>

    <div id="resultatDDR" class="result">
      <span>DDR calculée :</span>
      <span id="valDDR"></span>
    </div>

  </div>

<script>
function calculer() {
  const today = new Date();
  today.setHours(0,0,0,0);

  const ddr = document.getElementById('ddr').value;
  const sa = document.getElementById('sa').value;
  const saActuel = document.getElementById('saActuel').value;
  const joursActuel = document.getElementById('joursActuel').value;

  if (ddr) {
    const ddrDate = new Date(ddr);
    const diff = today - ddrDate;
    const jours = Math.floor(diff / (1000*60*60*24));
    
    if (jours >= 0) {
      document.getElementById('valAge').innerText = Math.floor(jours/7) + " SA + " + (jours%7) + " J";
      document.getElementById('resultatAge').style.display = "flex";
    }

    if (sa > 0) {
      const dateSA = new Date(ddrDate.getTime() + sa*7*24*60*60*1000);
      document.getElementById('labelSA').innerText = "Date pour " + sa + " SA :";
      document.getElementById('valSA').innerText = dateSA.toLocaleDateString('fr-FR');
      document.getElementById('resultatSA').style.display = "flex";
    } else {
      document.getElementById('resultatSA').style.display = "none";
    }
  } else {
    document.getElementById('resultatAge').style.display = "none";
    document.getElementById('resultatSA').style.display = "none";
  }

  if (saActuel !== "" && saActuel >= 0) {
    const totalJours = parseInt(saActuel)*7 + (parseInt(joursActuel) || 0);
    const ddrCalc = new Date(today.getTime() - totalJours*24*60*60*1000);
    document.getElementById('valDDR').innerText = ddrCalc.toLocaleDateString('fr-FR');
    document.getElementById('resultatDDR').style.display = "flex";
  } else {
    document.getElementById('resultatDDR').style.display = "none";
  }
}

function toggleContact() {
  const c = document.getElementById('contact');
  c.style.display = (c.style.display === "block") ? "none" : "block";
}
</script>
</body>
</html>
